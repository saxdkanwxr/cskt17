<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | caracakez</title>

    <meta
        name="description"
        content="Page not found."
    >

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Scripts -->
    <script src="js/site.js" defer></script>
</head>

<body>

    <main class="error-page">

        <div
            class="error-page__star error-page__star--one"
            aria-hidden="true"
        >
            ✦
        </div>

        <div
            class="error-page__star error-page__star--two"
            aria-hidden="true"
        >
            ✦
        </div>


        <div class="error-page__inner">

            <p class="eyebrow">
                Where you going?
            </p>

            <h1>
                404
            </h1>

            <p class="error-page__copy">
                This page either moved, disappeared, or never existed :P
            </p>

            <div class="error-page__actions">

                <a
                    class="button button--primary"
                    href="index.html"
                >
                    Go home
                    <span aria-hidden="true">↗</span>
                </a>

                <a
                    class="text-link"
                    href="shop.html"
                >
                    Visit the shop
                </a>

            </div>

        </div>

    </main>

</body>

</html>
